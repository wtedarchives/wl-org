<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster comparison</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#272b34;--text:#e6e8ec;--dim:#8b93a3;
        --accent:#5b9dff;--ok:#3ecf8e;--warn:#f0b429;--danger:#ff6b6b;}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;gap:14px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:var(--bg);z-index:20}
  header h1{font-size:14px;margin:0;font-weight:600;white-space:nowrap}
  .counts{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .layout{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 45px)}
  .side{border-right:1px solid var(--line);overflow:auto;padding:8px}
  .side input{width:100%;margin-bottom:8px}
  .gitem{padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:12px}
  .gitem:hover{background:var(--panel)}
  .gitem.active{background:var(--panel);border-color:var(--accent)}
  .gitem .meta{color:var(--dim);font-size:11px;display:flex;gap:8px;margin-top:2px}
  .gitem.done .meta b{color:var(--ok)}
  .main{overflow:auto;padding:16px}
  .colhead{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;
        display:grid;grid-template-columns:170px 1fr;gap:12px}
  .card.add{border-color:rgba(62,207,142,.55);box-shadow:0 0 0 1px rgba(62,207,142,.18)}
  .card.delete{border-color:rgba(255,107,107,.55);opacity:.65}
  .card.keep{border-color:rgba(91,157,255,.45)}
  .card img{width:100%;border-radius:6px;display:block;background:#000;cursor:zoom-in}
  .res{font-size:11px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
  .res b{color:var(--text)}
  .src{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;margin-bottom:6px}
  .src.database{background:rgba(91,157,255,.15);color:var(--accent)}
  .src.expressobeans{background:rgba(240,180,41,.15);color:var(--warn)}
  .f{margin-bottom:7px}
  .f label{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
  input,textarea,select{width:100%;background:#0d0f13;color:var(--text);border:1px solid var(--line);
        border-radius:5px;padding:5px 7px;font:inherit;font-size:12px}
  textarea{min-height:44px;resize:vertical}
  .chip{display:flex;gap:6px;align-items:center;background:#0d0f13;border:1px solid var(--line);
        border-radius:5px;padding:4px 8px;margin-bottom:4px;font-size:11px}
  .chip button{margin-left:auto;background:none;border:none;color:var(--danger);cursor:pointer}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  button.b{border:1px solid var(--line);background:#0d0f13;color:var(--text);border-radius:6px;
           padding:5px 11px;cursor:pointer;font:inherit;font-size:12px}
  button.b:hover{border-color:var(--accent)}
  button.b.on-add{background:var(--ok);border-color:var(--ok);color:#06231a;font-weight:600}
  button.b.on-del{background:var(--danger);border-color:var(--danger);color:#2b0707;font-weight:600}
  button.b.on-keep{background:var(--accent);border-color:var(--accent);color:#041428;font-weight:600}
  .ebmeta{font-size:11px;color:var(--dim);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
  .ebmeta a{color:var(--accent)}
  .results{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:5px;margin-top:4px}
  .results div{padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--line);font-size:11px}
  .results div:hover{background:#0d0f13;color:var(--accent)}
  .flag{display:inline-block;background:rgba(240,180,41,.12);color:var(--warn);border-radius:99px;
        padding:1px 8px;font-size:10px;margin:0 4px 4px 0}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;
            justify-content:center;z-index:100;cursor:zoom-out}
  #lightbox img{max-width:94vw;max-height:94vh}
  .empty{color:var(--dim);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  /* filled / missing state on editable fields */
  .fld-on{background:rgba(62,207,142,.10)!important;border-color:rgba(62,207,142,.45)!important}
  .fld-off{background:rgba(255,107,107,.08)!important;border-color:rgba(255,107,107,.40)!important}
  .shows-on{background:rgba(62,207,142,.10);border:1px solid rgba(62,207,142,.45);
            border-radius:5px;padding:4px;margin-bottom:4px}
  .shows-off{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.40);
             border-radius:5px;padding:4px;margin-bottom:4px}
  /* let the container's tint show through the chips inside it */
  .shows-on .chip,.shows-off .chip{background:transparent;border-color:transparent;margin-bottom:0}
  .shows-on .chip+.chip,.shows-off .chip+.chip{border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<header>
  <h1>Poster comparison</h1>
  <span class="counts" id="ghead"></span>
  <span style="flex:1"></span>
  <span class="counts" id="clip">clipboard: empty</span>
  <span class="counts" id="tally"></span>
  <button class="b" onclick="exportPlan()">Export staged plan</button>
</header>

<div class="layout">
  <div class="side">
    <input id="gsearch" placeholder="filter groups…" autocomplete="off">
    <select id="gfilter" style="margin-bottom:8px">
      <option value="both">Needs comparison (existing + new)</option>
      <option value="all">All groups</option>
      <option value="newonly">Candidates only</option>
      <option value="oldonly">Existing only</option>
      <option value="undecided">Has undecided</option>
    </select>
    <div id="glist"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg"></div>

<script>
let groups=[], cur=null, tours=[], clip=null
const $=id=>document.getElementById(id)
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

async function boot(){
  groups=await (await fetch('/api/groups')).json()
  tours=await (await fetch('/api/tours')).json()
  renderList(); if(list().length) openGroup(list()[0].key)
}

function list(){
  const f=$('gfilter').value, q=$('gsearch').value.toLowerCase()
  return groups.filter(g=>{
    if(q && !g.label.toLowerCase().includes(q)) return false
    if(f==='both') return g.existing&&g.candidates
    if(f==='newonly') return !g.existing&&g.candidates
    if(f==='oldonly') return g.existing&&!g.candidates
    if(f==='undecided') return g.decided<g.total
    return true
  })
}
$('gfilter').onchange=()=>{renderList()}
$('gsearch').oninput=()=>{renderList()}

function renderList(){
  const items=list()
  $('glist').innerHTML=items.map(g=>`
    <div class="gitem ${cur===g.key?'active':''} ${g.decided>=g.total?'done':''}" onclick="openGroup('${g.key}')">
      <div>${esc(g.label)}</div>
      <div class="meta"><span>${g.existing} db</span><span>${g.candidates} new</span>
        <b>${g.decided}/${g.total}</b></div>
    </div>`).join('')
  const dec=groups.reduce((a,g)=>a+g.decided,0), tot=groups.reduce((a,g)=>a+g.total,0)
  $('tally').textContent=`${dec}/${tot} decided · ${items.length} groups shown`
}

async function openGroup(key){
  cur=key; renderList()
  const g=await (await fetch('/api/group?key='+encodeURIComponent(key))).json()
  $('ghead').textContent=g.label
  $('main').innerHTML=`
    <div class="cols">
      <div><p class="colhead">In database (${g.existing.length})</p>
        <div class="stack">${g.existing.map(card).join('')||'<div class="empty">nothing in the database for this group</div>'}</div></div>
      <div><p class="colhead">Expresso Beans candidates (${g.candidates.length})</p>
        <div class="stack">${g.candidates.map(card).join('')||'<div class="empty">no candidates</div>'}</div></div>
    </div>`
}

function card(r){
  const db=r.source==='database'
  const d=r.decision||{}, e=d.edits||{}
  const v=k=>e[k]!==undefined?e[k]:r[k]
  const src=db?`/img/crop/${encodeURIComponent(r.image_file)}`
              :`/img/eb/${encodeURIComponent(r.print_id+'/'+r.image_file)}`
  const artist=(v('artist')||[])[0]||{}
  const state=d.action==='add'?'add':d.action==='delete'?'delete':d.action==='keep'?'keep':''
  return `<div class="card ${state}" id="c_${cssid(r._id)}">
    <div>
      <img loading="lazy" src="${src}" onclick="zoom('${src}')">
      <div class="res">${db?'current':'candidate'} · <b>${esc(r.resolution||'?')}</b></div>
      ${!db&&r.image_total>1?`<div class="res">image ${r.image_index} of ${r.image_total}</div>`:''}
    </div>
    <div>
      <span class="src ${r.source}">${db?'DATABASE':'EXPRESSO BEANS'}</span>
      ${(r.flags||[]).map(f=>`<span class="flag">${esc(f)}</span>`).join('')}
      <div class="f"><label>Shows</label>
        <div id="sh_${cssid(r._id)}" class="${(v('show')||[]).length?'shows-on':'shows-off'}">${(v('show')||[]).map((id,i)=>
          `<div class="chip"><span>${esc(r.show_labels&&r.show_labels[i]||id)}</span>
           <button onclick="rmShow('${r._id}','${id}')">×</button></div>`).join('')||
           '<div class="chip" style="color:var(--dim)">— none —</div>'}</div>
        <input placeholder="add show: date, venue, city…" oninput="findShow(this,'${r._id}')" autocomplete="off">
        <div class="results" hidden></div>
      </div>
      <div class="f"><label>Tour</label>
        <select data-tint class="${fc((v('tour')||[])[0])}" onchange="edit('${r._id}',{tour:this.value?[this.value]:null})">
          <option value="">— none —</option>
          ${tours.map(t=>`<option ${((v('tour')||[])[0]===t.tour)?'selected':''}>${esc(t.tour)}</option>`).join('')}
        </select></div>
      <div class="f" style="display:grid;grid-template-columns:1fr 1.3fr;gap:6px">
        <div><label>Artist</label>
          <input data-tint class="${fc(artist.name)}" value="${esc(artist.name||'')}" onchange="editArtist('${r._id}','name',this.value)"></div>
        <div><label>Artist link</label>
          <input data-tint class="${fc(artist.link)}" value="${esc(artist.link||'')}" onchange="editArtist('${r._id}','link',this.value)"></div>
      </div>
      <div class="f" style="display:grid;grid-template-columns:90px 1fr;gap:6px">
        <div><label>Print run</label>
          <input data-tint class="${fc(v('print_run'))}" type="number" value="${v('print_run')??''}" onchange="edit('${r._id}',{print_run:this.value===''?null:+this.value})"></div>
        <div><label>Description</label>
          <textarea data-tint class="${fc(v('description'))}" onchange="edit('${r._id}',{description:this.value||null})">${esc(v('description')||'')}</textarea></div>
      </div>
      <div class="acts">
        ${db?`<button class="b ${d.action==='keep'?'on-keep':''}" onclick="act('${r._id}','keep')">Keep</button>
              <button class="b ${d.action==='delete'?'on-del':''}" onclick="act('${r._id}','delete')">Delete</button>`
            :`<button class="b ${d.action==='add'?'on-add':''}" onclick="act('${r._id}','add')">Add</button>
              <button class="b ${d.action==='skip'?'on-keep':''}" onclick="act('${r._id}','skip')">Skip</button>`}
        <button class="b" onclick="copyFrom('${r._id}')">Copy fields</button>
        <button class="b" onclick="pasteTo('${r._id}')">Paste</button>
      </div>
      ${db?'':`<div class="ebmeta">${esc(r.title)} · ${esc(r.class)} / ${esc(r.status)}
        ${r.event?' · '+esc(r.event):''}<br><a href="${esc(r.eb_url)}" target="_blank">${esc(r.eb_url)}</a></div>`}
    </div></div>`
}

const cssid=s=>s.replace(/[^a-zA-Z0-9]/g,'_')
const fc=v=>(v!==null&&v!==undefined&&String(v).trim()!=='')?'fld-on':'fld-off'
// keep the tint honest while typing, before the change event fires
function tint(el){el.classList.toggle('fld-on',el.value.trim()!=='');el.classList.toggle('fld-off',el.value.trim()==='')}
document.addEventListener('input',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.dataset.tint)tint(e.target)})
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&e.target.dataset.tint)tint(e.target)})
function zoom(src){$('lbimg').src=src;$('lightbox').style.display='flex'}

let pending={}
async function flush(){
  if(!Object.keys(pending).length) return
  const body={decisions:pending}; pending={}
  await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
}

async function getRec(id){
  const g=await (await fetch('/api/group?key='+encodeURIComponent(cur))).json()
  return [...g.existing,...g.candidates].find(r=>r._id===id)
}

async function edit(id,patch){
  const r=await getRec(id)
  const d=r.decision||{action:null,edits:{}}
  d.edits={...(d.edits||{}),...patch}
  pending[id]=d; await flush(); await openGroup(cur)
}
async function editArtist(id,field,val){
  const r=await getRec(id)
  const d=r.decision||{action:null,edits:{}}
  const cur0=(d.edits?.artist!==undefined?d.edits.artist:r.artist)||[{}]
  const a={...(cur0[0]||{})}; a[field]=val
  d.edits={...(d.edits||{}),artist:[a]}
  pending[id]=d; await flush(); await openGroup(cur)
}
async function act(id,action){
  const r=await getRec(id)
  const d=r.decision||{edits:{}}
  d.action=d.action===action?null:action
  pending[id]=d; await flush()
  groups=await (await fetch('/api/groups')).json()
  renderList(); await openGroup(cur)
}
async function rmShow(id,sid){
  const r=await getRec(id)
  const d=r.decision||{action:null,edits:{}}
  const list0=(d.edits?.show!==undefined?d.edits.show:r.show)||[]
  d.edits={...(d.edits||{}),show:list0.filter(x=>x!==sid)}
  pending[id]=d; await flush(); await openGroup(cur)
}
async function findShow(input,id){
  const box=input.nextElementSibling, q=input.value.trim()
  if(q.length<2){box.hidden=true;return}
  const hits=await (await fetch('/api/shows?q='+encodeURIComponent(q))).json()
  box.hidden=false
  box.innerHTML=hits.map(h=>`<div onclick="addShow('${id}','${h.show_id}')">${esc(h.label)}</div>`).join('')
    ||'<div style="color:var(--dim)">no matches</div>'
}
async function addShow(id,sid){
  const r=await getRec(id)
  const d=r.decision||{action:null,edits:{}}
  const list0=(d.edits?.show!==undefined?d.edits.show:r.show)||[]
  if(!list0.includes(sid)) d.edits={...(d.edits||{}),show:[...list0,sid]}
  pending[id]=d; await flush(); await openGroup(cur)
}

async function copyFrom(id){
  const r=await getRec(id), e=r.decision?.edits||{}
  const v=k=>e[k]!==undefined?e[k]:r[k]
  clip={show:v('show'),tour:v('tour'),artist:v('artist'),print_run:v('print_run')??null,description:v('description')}
  $('clip').textContent='clipboard: '+(clip.artist?.[0]?.name||'fields')+' ('+((clip.show||[]).length)+' show)'
}
async function pasteTo(id){
  if(!clip){alert('Copy fields from a poster first.');return}
  await edit(id,{...clip})
}

async function exportPlan(){
  const r=await (await fetch('/api/export')).json()
  alert(`Staged plan written to ${r.file}\n\n  add:    ${r.add}\n  delete: ${r.delete}\n  update: ${r.update}\n\nNothing has been written to the database.`)
}
boot()
</script>
</body>
</html>
