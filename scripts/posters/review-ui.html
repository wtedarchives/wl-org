<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster review</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#272b34; --text:#e6e8ec; --dim:#8b93a3;
    --accent:#5b9dff; --ok:#3ecf8e; --warn:#f0b429; --danger:#ff6b6b;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  .counts { color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  main { display:grid; grid-template-columns: minmax(320px,44%) 1fr; gap:20px; padding:20px; align-items:start; }
  .imgwrap { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px;
             position:sticky; top:62px; }
  .imgwrap img { width:100%; border-radius:6px; display:block; background:#000; }
  .imgmeta { color:var(--dim); font-size:12px; margin-top:8px; word-break:break-all; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .field { margin-bottom:14px; }
  label { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
          color:var(--dim); margin-bottom:5px; }
  input, textarea, select {
    width:100%; background:#0d0f13; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font:inherit; }
  textarea { min-height:64px; resize:vertical; }
  .caption { white-space:pre-wrap; background:#0d0f13; border:1px solid var(--line);
             border-radius:6px; padding:10px; color:var(--dim); font-size:13px; }
  .chip { display:flex; align-items:center; gap:8px; background:#0d0f13; border:1px solid var(--line);
          border-radius:6px; padding:7px 10px; margin-bottom:6px; font-size:13px; }
  .chip button { margin-left:auto; background:none; border:none; color:var(--danger);
                 cursor:pointer; font-size:16px; line-height:1; }
  .flags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .flag { background:rgba(240,180,41,.12); color:var(--warn); border:1px solid rgba(240,180,41,.3);
          border-radius:99px; padding:2px 10px; font-size:12px; }
  .flag.none { background:rgba(62,207,142,.12); color:var(--ok); border-color:rgba(62,207,142,.3); }
  .actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  button.btn { border:1px solid var(--line); background:#0d0f13; color:var(--text);
               border-radius:7px; padding:9px 15px; cursor:pointer; font:inherit; }
  button.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--ok); border-color:var(--ok); color:#06231a; font-weight:600; }
  button.ghost { color:var(--dim); }
  button.danger { border-color:rgba(255,107,107,.4); color:var(--danger); }
  button.danger:hover { border-color:var(--danger); }
  .results { max-height:230px; overflow:auto; border:1px solid var(--line); border-radius:6px; margin-top:6px; }
  .results div { padding:7px 10px; cursor:pointer; border-bottom:1px solid var(--line); font-size:13px; }
  .results div:hover { background:#0d0f13; color:var(--accent); }
  .status { padding:3px 10px; border-radius:99px; font-size:12px; }
  .status.approved { background:rgba(62,207,142,.15); color:var(--ok); }
  .status.rejected { background:rgba(255,107,107,.15); color:var(--danger); }
  .status.deferred { background:rgba(240,180,41,.15); color:var(--warn); }
  .status.pending { background:var(--line); color:var(--dim); }
  .hint { color:var(--dim); font-size:12px; margin-top:12px; }
  kbd { background:#0d0f13; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:11px; }
  .row { display:flex; gap:8px; align-items:center; }
  /* filled / empty state on the editable fields */
  .filled { background:rgba(62,207,142,.10) !important; border-color:rgba(62,207,142,.45) !important; }
  .empty  { background:rgba(255,107,107,.08) !important; border-color:rgba(255,107,107,.40) !important; }
  #shows.filled, #shows.empty { border:1px solid; border-radius:6px; padding:6px; }
  #shows .chip { background:transparent; border-color:transparent; }
</style>
</head>
<body>
<header>
  <h1>Poster review</h1>
  <span class="counts" id="pos"></span>
  <div class="bar"><i id="bar"></i></div>
  <span class="counts" id="tally"></span>
  <select id="filter" style="width:auto">
    <option value="all">All</option>
    <option value="pending">Undecided</option>
    <option value="flagged">Flagged</option>
    <option value="noshow">No show/tour</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
    <option value="deferred">Deferred</option>
  </select>
  <button class="btn" onclick="exportApproved()">Export approved</button>
</header>

<main>
  <div class="imgwrap">
    <img id="img" alt="">
    <div class="imgmeta" id="imgmeta"></div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="status" id="status">pending</span>
      <span class="counts" id="postinfo"></span>
    </div>

    <div class="flags" id="flags"></div>

    <div class="field">
      <label>Caption (source)</label>
      <div class="caption" id="caption"></div>
    </div>

    <div class="field">
      <label>Shows</label>
      <div id="shows"></div>
      <input id="showq" placeholder="search by date (2024-06-23), venue, or city…" autocomplete="off">
      <div class="results" id="showres" hidden></div>
    </div>

    <div class="field">
      <label>Tour</label>
      <select id="tour"><option value="">— none —</option></select>
    </div>

    <div class="field">
      <label>Artist</label>
      <div class="row">
        <input id="aname" placeholder="name" style="flex:1">
        <input id="alink" placeholder="instagram url" style="flex:1.4">
      </div>
    </div>

    <div class="row">
      <div class="field" style="flex:1">
        <label>Print run</label>
        <input id="printrun" type="number" min="1" placeholder="e.g. 300">
      </div>
      <div class="field" style="flex:2">
        <label>Description</label>
        <textarea id="description"></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn ghost" onclick="go(-1)">← Prev</button>
      <button class="btn primary" onclick="approve()">Approve &amp; next</button>
      <button class="btn danger" onclick="mark('rejected')">Reject (don't import)</button>
      <button class="btn" onclick="mark('deferred')">Defer (decide later)</button>
      <button class="btn ghost" onclick="go(1)">Next →</button>
      <button class="btn" onclick="applyToPost()" id="applybtn">Apply fields to all images in post</button>
    </div>
    <div class="hint">
      <kbd>←</kbd>/<kbd>→</kbd> navigate · <kbd>A</kbd> approve · <kbd>R</kbd> reject · <kbd>D</kbd> defer · edits save automatically
    </div>
  </div>
</main>

<script>
let all = [], view = [], idx = 0, tours = []

const $ = (id) => document.getElementById(id)

async function boot() {
  all = await (await fetch('/api/records')).json()
  tours = await (await fetch('/api/tours')).json()
  for (const t of tours) {
    const o = document.createElement('option')
    o.value = t.tour; o.textContent = t.tour; $('tour').appendChild(o)
  }
  applyFilter()
}

function applyFilter() {
  const f = $('filter').value
  view = all.filter(r =>
    f === 'all' ? true :
    f === 'pending'  ? !r.review?.status || r.review.status === 'deferred' :
    f === 'flagged'  ? r.flags.length :
    f === 'noshow'   ? (!r.show && !r.tour) :
    f === 'approved' ? r.review?.status === 'approved' :
    f === 'rejected' ? r.review?.status === 'rejected' :
    f === 'deferred' ? r.review?.status === 'deferred' : true)
  idx = 0
  render()
}
$('filter').onchange = applyFilter

function cur() { return view[idx] }

function effective(r) {
  const e = r.review?.edits || {}
  return {
    show: e.show !== undefined ? e.show : r.show,
    tour: e.tour !== undefined ? e.tour : r.tour,
    artist: e.artist !== undefined ? e.artist : r.artist,
    print_run: e.print_run !== undefined ? e.print_run : r.print_run,
    description: e.description !== undefined ? e.description : r.description,
  }
}

function render() {
  const r = cur()
  if (!r) {
    $('img').removeAttribute('src')
    $('caption').textContent = 'Nothing matches this filter.'
    $('pos').textContent = '0 / 0'
    return
  }
  const v = effective(r)

  $('img').src = '/img/' + encodeURIComponent(r.image_file)
  $('imgmeta').textContent = r.image_file
  $('postinfo').textContent = `image ${r.image_index} of ${r.image_count} in post`
  $('caption').textContent = r.caption || '(no caption)'

  const st = r.review?.status || 'pending'
  $('status').textContent = st
  $('status').className = 'status ' + st

  $('flags').innerHTML = r.flags.length
    ? r.flags.map(f => `<span class="flag">${esc(f)}</span>`).join('')
    : '<span class="flag none">no flags</span>'

  renderShows(v.show || [])
  $('tour').value = (v.tour && v.tour[0]) || ''
  $('aname').value = v.artist?.[0]?.name || ''
  $('alink').value = v.artist?.[0]?.link || ''
  $('printrun').value = v.print_run ?? ''
  $('description').value = v.description || ''

  paint()

  $('pos').textContent = `${idx + 1} / ${view.length}`
  const app = all.filter(x => x.review?.status === 'approved').length
  const rej = all.filter(x => x.review?.status === 'rejected').length
  const def = all.filter(x => x.review?.status === 'deferred').length
  const done = app + rej
  $('tally').textContent =
    `${app} approved · ${rej} rejected` + (def ? ` · ${def} deferred` : '') + ` · ${done}/${all.length} settled`
  $('bar').style.width = (100 * done / all.length) + '%'
}

function renderShows(ids) {
  const r = cur()
  $('shows').innerHTML = ids.length
    ? ids.map((id, i) => {
        const lab = r.show_labels?.[i] && (r.show || [])[i] === id ? r.show_labels[i] : id
        return `<div class="chip"><span>${esc(lab)}</span><button onclick="removeShow('${id}')">×</button></div>`
      }).join('')
    : '<div class="chip" style="color:var(--dim)">— no shows linked —</div>'
}

function removeShow(id) {
  const v = effective(cur())
  patch({ show: (v.show || []).filter(x => x !== id) })
}

$('showq').oninput = async (e) => {
  const q = e.target.value.trim()
  if (q.length < 2) { $('showres').hidden = true; return }
  const hits = await (await fetch('/api/shows?q=' + encodeURIComponent(q))).json()
  $('showres').hidden = false
  $('showres').innerHTML = hits.map(h =>
    `<div onclick="addShow('${h.show_id}', ${JSON.stringify(h.label).replace(/"/g,'&quot;')})">${esc(h.label)}</div>`
  ).join('') || '<div style="color:var(--dim)">no matches</div>'
}

function addShow(id, lab) {
  const r = cur(), v = effective(r)
  const show = [...(v.show || [])]
  if (!show.includes(id)) show.push(id)
  r.show_labels = r.show_labels || []
  const i = show.indexOf(id)
  r.show_labels[i] = lab
  patch({ show })
  $('showq').value = ''
  $('showres').hidden = true
}

function collect() {
  const name = $('aname').value.trim(), link = $('alink').value.trim()
  const tour = $('tour').value
  return {
    tour: tour ? [tour] : null,
    artist: name || link ? [{ name, link }] : null,
    print_run: $('printrun').value === '' ? null : Number($('printrun').value),
    description: $('description').value.trim() || null,
  }
}

for (const id of ['aname','alink','printrun','description','tour']) {
  $(id).addEventListener('change', () => patch(collect()))
}

async function patch(edits, status) {
  const r = cur()
  r.review = r.review || { status: null, edits: {} }
  r.review.edits = { ...r.review.edits, ...edits }
  if (status) r.review.status = status
  await fetch('/api/save', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: r.id, review: r.review }),
  })
  render()
}

function approve() { patch(collect(), 'approved').then(() => go(1)) }
function mark(s) { patch(collect(), s).then(() => go(1)) }

function go(d) {
  if (!view.length) return
  idx = Math.max(0, Math.min(view.length - 1, idx + d))
  render()
}

async function applyToPost() {
  const r = cur(), v = { ...effective(r), ...collect() }
  const sibs = all.filter(x => x.base === r.base && x.id !== r.id)
  for (const s of sibs) {
    s.review = s.review || { status: null, edits: {} }
    s.review.edits = { ...s.review.edits, ...v }
    await fetch('/api/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: s.id, review: s.review }),
    })
  }
  $('applybtn').textContent = `applied to ${sibs.length} sibling(s)`
  setTimeout(() => ($('applybtn').textContent = 'Apply fields to all images in post'), 1500)
}

async function exportApproved() {
  const r = await (await fetch('/api/export')).json()
  alert(`Wrote ${r.written} approved records to ${r.file}`)
}

document.onkeydown = (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return
  if (e.key === 'ArrowLeft') go(-1)
  if (e.key === 'ArrowRight') go(1)
  if (e.key.toLowerCase() === 'a') approve()
  if (e.key.toLowerCase() === 'r') mark('rejected')
  if (e.key.toLowerCase() === 'd') mark('deferred')
}

function paint() {
  const has = (el, ok) => {
    el.classList.toggle('filled', !!ok)
    el.classList.toggle('empty', !ok)
  }
  const v = effective(cur() || {})
  has($('shows'), (v.show || []).length)
  has($('tour'), !!$('tour').value)
  has($('aname'), !!$('aname').value.trim())
  has($('alink'), !!$('alink').value.trim())
  has($('printrun'), $('printrun').value !== '')
  has($('description'), !!$('description').value.trim())
}

for (const id of ['aname','alink','printrun','description','tour']) {
  $(id).addEventListener('input', paint)
}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
boot()
</script>
</body>
</html>
