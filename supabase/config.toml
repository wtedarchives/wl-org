# Function settings for deploy (supabase functions deploy).
# https://supabase.com/docs/guides/functions/function-configuration

[functions.bandcamp-album-id]
verify_jwt = false

[functions.bandcamp-album-tracks]
verify_jwt = false

[functions.radio-co-playlists]
verify_jwt = true

[functions.wted-radio-backfill-artwork]
verify_jwt = true

# Wysteria admin JWT verified inside the function (anon JWT in Authorization for gateway only).
[functions.dpro-admin]
verify_jwt = false

[functions.wted-episodes-admin]
verify_jwt = false

# Wysteria JWT in Authorization is verified inside the function (not a Supabase Auth token).
[functions.setlist-game-submission]
verify_jwt = false

[functions.user-attendance]
verify_jwt = false

[functions.user-profile-preferences]
verify_jwt = false

# Native-app APNs token registration (anon; per-device, no sign-in).
[functions.apns-register]
verify_jwt = false

[functions.show-rating]
verify_jwt = false

# Wysteria JWT verified inside the function (not a Supabase Auth token).
[functions.ranking-engine]
verify_jwt = false

# Public image proxy with strict upstream allowlist (anon invoke via fetch + apikey headers).
[functions.schedule-share-image-proxy]
verify_jwt = false

# Wysteria admin JWT verified inside the function; PNG body is raw image/png bytes.
[functions.radio-schedule-share-upload]
verify_jwt = false

# Custom API keys validated inside the function (not Supabase Auth JWTs).
[functions.bot-read-api]
verify_jwt = false
